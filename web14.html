<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1d1d1d);
    color:white;
    direction:rtl;
}

header{
    background:#151515;
    padding:25px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

header h1{
    color:#00ffd0;
    font-size:45px;
}

.container{
    width:85%;
    margin:auto;
    margin-top:50px;
    margin-bottom:50px;
}

.card{
    background:#1d1d1d;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
    color:#00ffd0;
    margin-bottom:20px;
}

p{
    font-size:20px;
    line-height:2.2;
    color:#ddd;
}

span{
    color:#00ffd0;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    font-size:35px;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.back-btn:hover{
    color:#00ffd0;
    transform:scale(1.2);
}

/* الفورم */

.contact-form{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.contact-form input,
.contact-form textarea{

    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:18px;
    outline:none;
}

.contact-form textarea{
    height:180px;
    resize:none;
}

.contact-form button{

    background:#00ffd0;
    color:black;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.contact-form button:hover{

    transform:scale(1.03);
    background:white;
}
.contact-bar{
    width:100%;
    background:rgb(146, 113, 3);
    padding:25px;
    text-align:center;
    margin-top:60px;
    border-top:3px solid #caa11b;
}

.contact-bar h2{
    color:black;
    font-size:35px;
    margin-bottom:10px;
}

.contact-bar p{
    color:black;
    font-size:22px;
    line-height:2;
}

.contact-bar a{
    color:black;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.contact-bar a:hover{
    color:white;
}
.contact-social{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
    flex-wrap:wrap;
}

.contact-social img{
    width:60px;
    height:60px;
    border-radius:15px;
    transition:0.3s;
}

.contact-social img:hover{
    transform:scale(1.1);
}
</style>
</head>
