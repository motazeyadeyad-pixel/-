<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العروض الخاصة</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma;
}

body{
    background:linear-gradient(135deg,#0f0f0f,#1d1d1d);
    color:white;
    direction:rtl;
}

header{
    background:#151515;
    padding:25px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.6);
}

header h1{
    color:#00ffd0;
    font-size:45px;
}

.container{
    width:85%;
    margin:auto;
    margin-top:50px;
}

.card{
    background:#1d1d1d;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.02);
}

h2{
    color:#00ffd0;
    margin-bottom:15px;
}

p{
    font-size:20px;
    line-height:2;
    color:#ddd;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    font-size:35px;
    text-decoration:none;
    color:white;
}

.back-btn:hover{
    color:#00ffd0;
    transform:scale(1.2);
}

</style>
</head>

<body>

<a class="back-btn" href="web2.html">⬅</a>

<header>
<h1>🔥 العروض الخاصة</h1>
</header>

<div class="container">

<div class="card">
<h2>خصومات قوية</h2>
<p>
خصومات تصل إلى 30% على الأدوات الموسيقية ومعدات الاستوديو لفترة محدودة،
مع عروض موسمية مميزة جدًا لعشاق الموسيقى.
</p>
</div>

</div>

</body>
</html>
