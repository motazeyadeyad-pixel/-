<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سلة الطلبات</title>

<style>

body{
    background:#111;
    font-family:Tahoma;
    direction:rtl;
    color:white;
    text-align:center;
    margin:0;
}

header{
    background:#1d1d1d;
    padding:25px;
}

header h1{
    color:#00ffd0;
    font-size:45px;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    font-size:40px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.back-btn:hover{
    transform:scale(1.2);
    color:#00ffd0;
}

.cart{
    width:80%;
    margin:auto;
    margin-top:60px;
    background:#1d1d1d;
    padding:40px;
    border-radius:20px;
}

.empty{
    color:#888;
    font-size:30px;
    margin-top:20px;
}

.icon{
    font-size:80px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<a href="web2.html" class="back-btn">⬅</a>

<header>
    <h1>🛒 سلة الطلبات 🛒</h1>
</header>

<div class="cart">

<div class="icon">🛍</div>

<p class="empty">
السلة فارغة
</p>

</div>

</body>
</html>
