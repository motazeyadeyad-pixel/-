<title>متجر موسيقاتي</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Tahoma;
    direction:rtl;
    color:white;
    text-align:center;
}

/* زر الرجوع */

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    font-size:40px;
    color:white;
    text-decoration:none;
    transition:0.3s;
    z-index:999;
}

.back-btn:hover{
    transform:scale(1.2);
    color:#00ffd0;
}

/* العنوان */

h1{
    margin-top:40px;
    font-size:55px;
    color:#00ffd0;
}

h2{
    margin-top:10px;
    color:#ccc;
}

/* المنتجات */

.container{
    width:90%;
    margin:50px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

/* الكرت */

.card{
    background:#1d1d1d;
    border-radius:20px;
    overflow:hidden;
    padding-bottom:20px;
    transition:0.4s;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
}

/* السلايدر */

.slider{
    position:relative;
    width:100%;
    height:230px;
    overflow:hidden;
    background:#111;
}

/* الصور */

.slider img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    top:0;
    right:0;
    opacity:0;
    transition:1s;
    padding:10px;
    background:#111;
}


/* الصورة الفعالة */

.slider img.active{
    opacity:1;
}

/* النص */

.card p{
    margin-top:18px;
    font-size:24px;
}

/* الزر */

.btn{
    margin-top:15px;
    padding:12px 35px;
    border:none;
    border-radius:12px;
    background:#00ffd0;
    color:black;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.08);
    background:white;
}

/* للجوال */

@media(max-width:900px){

.container{
    grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.container{
    grid-template-columns:1fr;
}

h1{
    font-size:40px;
}

}

</style>

</head>

<script>

function startSlider(sliderClass){

let slides = document.querySelectorAll("." + sliderClass + " img");

let index = 0;

setInterval(() => {

slides[index].classList.remove("active");

index++;

if(index >= slides.length){
index = 0;
}

slides[index].classList.add("active");

},2500);

}

/* تشغيل كل الأقسام */

startSlider("violin-slider");
startSlider("piano-slider");
startSlider("guitar-slider");
startSlider("drum-slider");
startSlider("speaker-slider");
startSlider("studio-slider");

</script>
