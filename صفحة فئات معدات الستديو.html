/* الهيدر */

header{
width:100%;
background:#151515;
padding:15px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.5);
position:fixed;
top:0;
right:0;
z-index:999;
}

/* القائمة */

.menu{
position:absolute;
top:20px;
right:20px;
}

.menu-btn{

background:#00ffd0;
border:none;
font-size:25px;
padding:8px 16px;
border-radius:10px;
cursor:pointer;

}

.menu-content{

display:none;
position:absolute;
right:0;
top:55px;
background:#1d1d1d;
width:230px;
border-radius:15px;

}

.menu-content a{

display:flex;
align-items:center;
gap:10px;
padding:15px;
text-decoration:none;
color:white;

}

.menu-content a:hover{

background:#00ffd0;
color:black;

}

.menu-content img{

width:40px;

}

/* اللوجو */

.top-logo img{

width:70px;
height:70px;
border-radius:50%;

}

.top-logo h1{

color:#00ffd0;

}

/* الكبسات */

.top-links{

display:flex;
justify-content:center;
gap:25px;
margin-top:15px;
border-top:2px solid #333;
padding-top:15px;

}

.top-links a img{

width:120px;
border-radius:10px;

}

.top-links a img:hover{

transform:scale(1.08);

}

/* العنوان */

.category-title{

text-align:center;
font-size:45px;
margin-top:90px;
color:#00ffd0;

}

/* المنتجات */

.products-grid{

width:85%;
margin:auto;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:35px;

}

.product-link{

text-decoration:none;
color:white;

}

.product-card{

background:#1d1d1d;
border-radius:22px;
overflow:hidden;
text-align:center;
padding-bottom:18px;

}

.product-card:hover{

transform:translateY(-10px);

}

.product-card img{

width:100%;
height:240px;
object-fit:contain;
background:#111;
padding:10px;

}

.product-name{

font-size:23px;
margin-top:15px;

}

.product-price{

color:#00ffd0;
margin-top:8px;

}

.product-rate{

color:gold;
margin-top:8px;

}
.back-btn{
    position:absolute;
    top:20px;
    left:20px;
    color:rgb(255, 255, 255);
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    transition:0.3s;
}

.back-btn:hover{
    transform:scale(1.05);
    background:#00bfa6;
}
</style>
