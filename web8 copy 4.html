<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سلة الطلبات</title>

<style>

body{
    background:#111;
    font-family:Tahoma;
    direction:rtl;
    color:white;
    text-align:center;
}
.btn{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:#00ffd0;
    color:black;
    font-size:20px;
    cursor:pointer;
}
header{
    background:#1b1b1b;
    padding:25px;
}

header h1{
    color:#00ffd0;
    font-size:45px;
}

.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    font-size:40px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.back-btn:hover{
    transform:scale(1.2);
    color:#00ffd0;
}

.cart{
    width:80%;
    margin:auto;
    margin-top:60px;
    background:#1d1d1d;
    padding:30px;
    border-radius:20px;
}

.cart img{
    width:250px;
    border-radius:20px;
    margin-top:20px;
}

h2{
    margin-top:25px;
    font-size:35px;
    color:#00ffd0;
}

p{
    margin-top:20px;
    font-size:24px;
}

.price{
    color:#00ffd0;
    font-size:30px;
}

.done{
    margin-top:30px;
    background:#00ffd0;
    color:black;
    padding:15px;
    border-radius:15px;
    font-size:24px;
}

</style>
</head>

<body>

<a href="web.html" class="back-btn">⬅</a>

<header>
    <h1>🛒 سلة الطلبات 🛒</h1>
</header>

<div class="cart">

<img src="الطبلة-300x220.jpg">

<h2>تم إضافة المنتج الطبلة للسلة ✅</h2>

<p>
تم شراء المنتج بنجاح وإضافته إلى سلة الطلبات.
</p>

<p class="price">
السعر: 25 دينار
</p>

<div class="done">
✔ شكراً لشرائك من متجر موسيقاتي
</div>

</div>

</body>
</html>
